{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1>Change Password</h1>
{% if current_user.must_change_password %}
  <div class="card"><p class="muted">You must change your password before continuing.</p></div>
{% endif %}
<div class="card" style="max-width:440px;">
  <form method="post" action="{{ url_for('auth.change_password') }}">
    {% if not current_user.must_change_password %}
    <label>Current password<input type="password" name="current_password" required /></label>
    {% endif %}
    <label style="margin-top:0.6rem;">New password<input type="password" name="new_password" required /></label>
    <label style="margin-top:0.6rem;">Confirm new password<input type="password" name="confirm_password" required /></label>
    <button type="submit">Update password</button>
  </form>
</div>
{% endblock %}
