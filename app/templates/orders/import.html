{% extends "base.html" %}
{% block title %}Import Orders{% endblock %}
{% block content %}
<h1>Import Orders.xlsx</h1>
<div class="card">
  <p class="muted">Required columns: <b>order_number</b>, <b>sku</b>, <b>quantity</b>. Optional: customer, description. Rows with the same order_number are grouped into one order.</p>
  <form method="post" enctype="multipart/form-data" class="inline-form">
    <label>Orders workbook
      <input type="file" name="file" accept=".xlsx" required />
    </label>
    <button type="submit">Import</button>
    <a class="btn-secondary btn" href="{{ url_for('orders.template') }}">Download template</a>
  </form>
</div>
{% endblock %}
