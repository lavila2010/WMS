services:
  - type: web
    name: wms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
  - type: web
    name: wms-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: WMS_ENV
        value: production
      - key: WMS_V2_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: WMS_TIMEZONE
        value: America/New_York
      - key: DOCUMENT_STORE
        value: local
      - key: MAX_UPLOAD_MB
        value: "50"
  - type: worker
    name: wms-v2-import-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.inventory_import_worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: WMS_ENV
        value: production
      - key: WMS_V2_DATABASE_URL
        fromService:
          type: web
          name: wms-v2
          envVarKey: WMS_V2_DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: wms-v2
          envVarKey: SECRET_KEY
      - key: WMS_TIMEZONE
        value: America/New_York
      - key: DOCUMENT_STORE
        value: local
      - key: MAX_UPLOAD_MB
        value: "50"
